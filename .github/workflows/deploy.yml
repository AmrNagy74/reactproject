name: Deploy react

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t amrnagy74/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true amrnagy74/react-test npm run test
      
      - run : docker build -t amr/multi-client ./microservices/client
      - run : docker build -t amr/multi-nginx ./microservices/nginx
      - run : docker build -t amr/multi-server ./microservices/server
      - run : docker build -t amr/multi-worker ./microservices/worker
    
      - run : docker push amr/multi-client
      - run : docker push amr/multi-nginx
      - run : docker push amr/multi-server
      - run : docker push amr/multi-worker

